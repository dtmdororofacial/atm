<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articulação temporomandibular 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --or:#e8782a; --or2:#f39a52; --g1:#151618; --g2:#202226; --g3:#2b2e33; --g4:#3a3e44; --tx:#eceae6; --tx2:#a9adb3;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 45% 38%,#3b3e43 0%,#232529 55%,#141517 100%);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{position:fixed;inset:0}
#app canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.lbl span{display:inline-block;font:500 11px/1.25 Inter,system-ui,sans-serif;color:#f4f2ee;background:rgba(24,26,29,.82);border:1px solid rgba(232,120,42,.65);padding:2px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.lbl.sub span{border-color:rgba(200,204,210,.45);color:#d9dadc;font-weight:400}
header.title{position:fixed;left:20px;top:16px;pointer-events:none;max-width:52vw}
header.title .brand{display:block;width:172px;height:auto;margin:0 0 6px}
header.title .credit{font-size:11.5px;color:var(--tx2);letter-spacing:.2px;margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--g4);max-width:300px}
header.title h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.1px}
header.title h1 b{color:var(--or);font-weight:700}
header.title p{margin:4px 0 0;font-size:12.5px;color:var(--tx2)}
#panel{position:fixed;right:16px;top:16px;width:300px;background:rgba(32,34,38,.88);backdrop-filter:blur(8px);border:1px solid var(--g4);border-radius:12px;padding:14px 14px 10px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:calc(100vh - 140px);overflow:auto}
#panel h3{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--tx2)}
#panel section+section{margin-top:14px;padding-top:12px;border-top:1px solid var(--g4)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font:500 12.5px Inter,system-ui,sans-serif;color:var(--tx);background:var(--g3);border:1px solid var(--g4);border-radius:8px;padding:8px 10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:#5a5f66;background:#33363c}
button.on{background:var(--or);border-color:var(--or);color:#1b1206;font-weight:600}
.seg button{text-align:left;line-height:1.25;min-height:44px}
#condDesc{font-size:12.5px;line-height:1.45;color:#d4d5d7;margin:10px 0 0}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btnrow button.wide{grid-column:1 / -1}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
.toggles label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#d4d5d7;cursor:pointer;user-select:none}
.toggles input{accent-color:var(--or);width:15px;height:15px}
#transport{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(32,34,38,.9);backdrop-filter:blur(8px);border:1px solid var(--g4);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(760px,calc(100vw - 32px))}
#play{min-width:84px}
.sl{flex:1;display:flex;flex-direction:column;gap:4px;min-width:120px}
.sl span{font-size:11px;color:var(--tx2);letter-spacing:.4px}
input[type=range]{width:100%;accent-color:var(--or)}
select{font:500 12.5px Inter,system-ui,sans-serif;background:var(--g3);color:var(--tx);border:1px solid var(--g4);border-radius:8px;padding:7px 6px}
.readout{min-width:150px}
.readout .mm{font-size:24px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.readout .mm small{font-size:13px;font-weight:500;color:var(--tx2);margin-left:3px}
.readout .cap{font-size:10.5px;color:var(--tx2);letter-spacing:.3px}
.gauge{position:relative;height:5px;background:var(--g4);border-radius:3px;margin-top:5px;overflow:visible}
.gauge #gfill{position:absolute;left:0;top:0;bottom:0;background:var(--or);border-radius:3px;width:0}
.gauge i{position:absolute;top:-3px;width:1px;height:11px;background:#cfd2d6}
.gauge em{position:absolute;top:8px;font-size:9px;color:var(--tx2);font-style:normal;transform:translateX(-50%)}
#phase{position:fixed;left:20px;bottom:110px;font-size:13px;color:#d9dadc;background:rgba(32,34,38,.75);border:1px solid var(--g4);border-radius:8px;padding:7px 11px;pointer-events:none}
#phase b{color:var(--or2);font-weight:600}
#tip{position:fixed;pointer-events:none;max-width:320px;background:rgba(20,21,24,.95);border:1px solid var(--or);border-radius:8px;padding:8px 11px;font-size:12.5px;line-height:1.4;color:#e4e3e0;opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip b{display:block;color:var(--or2);font-size:13px;margin-bottom:2px;font-weight:600}
#flash{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);font-size:22px;font-weight:700;color:#fff;background:rgba(232,120,42,.92);padding:8px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;letter-spacing:.2px}
#flash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tx2)}
@media (max-width:820px){
  header.title{max-width:calc(100vw - 32px)}
  header.title h1{font-size:16px}
  header.title .brand{width:112px;margin-bottom:4px}
  header.title .credit{font-size:10.5px;margin-bottom:8px;padding-bottom:6px}
  header.title p{display:none}
  #panel{top:auto;bottom:118px;right:8px;left:8px;width:auto;max-height:34vh;padding:10px}
  .seg{grid-template-columns:1fr 1fr}
  .seg button{min-height:38px;font-size:11.5px;padding:6px 8px}
  #condDesc{display:none}
  #transport{bottom:8px;gap:8px;padding:8px 10px;flex-wrap:wrap}
  .readout{min-width:110px}
  #phase{display:none}
}
</style>

</script>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== utilidades ============================== */
const DEG = Math.PI/180;
const V3 = THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const ease=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};

function spline1D(pts){
  const n=pts.length;
  return x=>{
    if(x<=pts[0][0]) return pts[0][1];
    if(x>=pts[n-1][0]) return pts[n-1][1];
    let i=0; while(x>pts[i+1][0]) i++;
    const p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,n-1)];
    const h=p2[0]-p1[0], t=(x-p1[0])/h;
    const m1=(p2[1]-p0[1])/(p2[0]-p0[0])*h, m2=(p3[1]-p1[1])/(p3[0]-p1[0])*h;
    const t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*p1[1]+(t3-2*t2+t)*m1+(-2*t3+3*t2)*p2[1]+(t3-t2)*m2;
  };
}

class Grid{
  constructor(rows,cols,{wrap=false,flip=false,skip=null}={}){
    this.rows=rows;this.cols=cols;
    const g=this.geom=new THREE.BufferGeometry();
    this.pos=new Float32Array(rows*cols*3);
    this.attr=new THREE.BufferAttribute(this.pos,3); this.attr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position',this.attr);
    const uv=new Float32Array(rows*cols*2);
    for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const k=(i*cols+j)*2;uv[k]=wrap?j/cols:j/Math.max(cols-1,1);uv[k+1]=i/Math.max(rows-1,1);}
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    const idx=[];const cm=wrap?cols:cols-1;
    for(let i=0;i<rows-1;i++)for(let j=0;j<cm;j++){
      if(skip&&skip(i,j))continue;
      const a=i*cols+j,b=(i+1)*cols+j,c=(i+1)*cols+(j+1)%cols,d=i*cols+(j+1)%cols;
      if(!flip)idx.push(a,b,d,b,c,d);else idx.push(a,d,b,b,d,c);
    }
    g.setIndex(idx);
  }
  set(i,j,x,y,z){const k=(i*this.cols+j)*3;this.pos[k]=x;this.pos[k+1]=y;this.pos[k+2]=z;}
  done(){this.attr.needsUpdate=true;this.geom.computeVertexNormals();this.geom.computeBoundingSphere();this.geom.computeBoundingBox();return this.geom;}
}

/* textura procedural: ruído de cor na superfície (sem imagens) */
const NOISE_GLSL=`
float gHash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float gNoise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
return mix(mix(mix(gHash(i),gHash(i+vec3(1,0,0)),f.x),mix(gHash(i+vec3(0,1,0)),gHash(i+vec3(1,1,0)),f.x),f.y),
mix(mix(gHash(i+vec3(0,0,1)),gHash(i+vec3(1,0,1)),f.x),mix(gHash(i+vec3(0,1,1)),gHash(i+vec3(1,1,1)),f.x),f.y),f.z);}
float gFbm(vec3 p){float a=.5,s=0.;for(int k=0;k<4;k++){s+=a*gNoise(p);p*=2.03;a*=.5;}return s/.9375;}
`;
function grain(mat,sc=.35,amp=.14,sc2=2.2,amp2=.06){
  mat.onBeforeCompile=sh=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vGP;').replace('#include <begin_vertex>','#include <begin_vertex>\nvGP=position;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vGP;\n'+NOISE_GLSL)
      .replace('#include <color_fragment>',`#include <color_fragment>
      float gA=gFbm(vGP*${sc.toFixed(3)});float gB=gNoise(vGP*${sc2.toFixed(3)});
      diffuseColor.rgb*=(1.0+${amp.toFixed(3)}*(gA-.5)*2.0+${amp2.toFixed(3)}*(gB-.5)*2.0);`);
  };
  mat.customProgramCacheKey=()=>'gr'+sc+'_'+amp+'_'+sc2+'_'+amp2;
  return mat;
}
function fiberTexture(base,light,dark,lines=90){
  const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,512,256);
  for(let i=0;i<lines*3;i++){
    const px=Math.random()*512,w=.6+Math.random()*2.2;
    x.globalAlpha=.08+Math.random()*.22;x.fillStyle=Math.random()<.5?light:dark;
    x.fillRect(px,0,w,256);
  }
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,1);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;
}

function headRadial(phi,z){
  let r=Rz(z);

}

const I_LOCAL=[92,-36]; // borda incisal inferior no referencial da mandíbula
function gapAt(phiW,theta,psi){
  const pd=phiW-psi;let t;
  if(pd>=DISC_MIN&&pd<=DISC_MAX)t=Math.max(.2,thick(pd));else if(pd<DISC_MIN)t=.9;else t=.25;
  return headRadial(phiW+theta,0)+GI+t+GS;
}
function solveCondyle(xc,theta,psi,y0=-7){
  let yc=y0;
  for(let it=0;it<5;it++){
    let best=Infinity;
    for(const [px,py] of PROFILE){
      const dx=px-xc;if(Math.abs(dx)>10)continue;
      const phiW=Math.atan2(dx,py-yc)/DEG;
      const g=gapAt(phiW,theta,psi);
      if(Math.abs(dx)>=g)continue;
      const y=py-Math.sqrt(g*g-dx*dx);
      if(y<best)best=y;
    }
    if(!isFinite(best))break;
    yc=lerp(yc,best,it===0?1:.7);
  }
  return yc;
}
const psiN=s=>-30*s;
const psiD=s=>C.psiD+10*s;
const sOf=u=>C.sMax*smooth((u-.2)/.8);
function incisal(xc,yc,thDeg){const t=thDeg*DEG,c=Math.cos(t),s=Math.sin(t);return [xc+I_LOCAL[0]*c-I_LOCAL[1]*s,yc+I_LOCAL[0]*s+I_LOCAL[1]*c];}
function calibrate(){
  const psi0=C.displaced?psiD(0):0;
  const y0=solveCondyle(-1,0,psi0);C.I0=incisal(-1,y0,0);C.y0=y0;
  const s=C.sMax,psi1=(C.displaced&&!C.reducing)?psiD(s):psiN(s),xc=-1+14*s;
  let lo=5,hi=60;
  for(let k=0;k<30;k++){
    const mid=(lo+hi)/2;const yc=solveCondyle(xc,-mid,psi1,y0-3);const I=incisal(xc,yc,-mid);
    const d=Math.hypot(I[0]-C.I0[0],I[1]-C.I0[1]);
    if(d<C.target)lo=mid;else hi=mid;
  }
  C.thetaMax=(lo+hi)/2;
}

function zLat(x,y){const tx=clamp((x-X0)/(X1-X0),0,1),yb=Tsurf(x,Z1),yt=topY(x,Z1),ty=clamp((y-yb)/(yt-yb),0,1);return Z1+2.2*Math.sin(Math.PI*tx)*Math.sin(Math.PI*ty);}
function buildTemporal(){
  const nx=150,nz=56,ny=18,outer=[],sec=[];
  let g=new Grid(nx+1,nz+1);
  for(let i=0;i<=nx;i++)for(let j=0;j<=nz;j++){const x=lerp(X0,X1,i/nx),z=lerp(Z0,Z1,j/nz);g.set(i,j,x,Tsurf(x,z),z);}outer.push(g.done());
  g=new Grid(nx+1,ny+1);
  for(let i=0;i<=nx;i++){const x=lerp(X0,X1,i/nx),yb=Tsurf(x,Z1),yt=topY(x,Z1);for(let j=0;j<=ny;j++){const y=lerp(yb,yt,j/ny);g.set(i,j,x,y,zLat(x,y));}}outer.push(g.done());
  g=new Grid(nx+1,nz+1,{flip:true});
  for(let i=0;i<=nx;i++)for(let j=0;j<=nz;j++){const x=lerp(X0,X1,i/nx),z=lerp(Z0,Z1,j/nz);g.set(i,j,x,topY(x,z),z);}sec.push(g.done());
  g=new Grid(nx+1,ny+1,{flip:true});
  for(let i=0;i<=nx;i++){const x=lerp(X0,X1,i/nx),yb=Tsurf(x,Z0),yt=topY(x,Z0);for(let j=0;j<=ny;j++)g.set(i,j,x,lerp(yb,yt,j/ny),Z0);}sec.push(g.done());
  for(const [xw,fl] of [[X1,true],[X0,false]]){
    g=new Grid(nz+1,ny+1,{flip:fl});
    for(let i=0;i<=nz;i++){const z=lerp(Z0,Z1,i/nz),yb=Tsurf(xw,z),yt=topY(xw,z);for(let j=0;j<=ny;j++)g.set(i,j,xw,lerp(yb,yt,j/ny),z);}sec.push(g.done());
  }
  return{outer:mergeGeometries(outer),sec:mergeGeometries(sec)};
}

class Strand{
  constructor(p,o){
    Object.assign(this,{segs:40,rad:14,up:new V3(0,1,0),scale:1,dynamic:false},o);
    this.p=p;this.grid=new Grid(this.segs+3,this.rad,{wrap:true,flip:true});
    this.mesh=addMesh(p,this.grid.geom,o.mat,{hover:o.hover!==false});
    if(o.cast===false)this.mesh.raycast=()=>{};
    this.update();strands.push(this);
  }
  update(){
    const pts=this.pts();const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
    const P_=new V3(),T=new V3(),N=new V3(),B=new V3(),g=this.grid,n=this.segs,rad=this.rad;
    for(let k=0;k<=n;k++){
      const t=k/n;curve.getPoint(t,P_);curve.getTangent(t,T);
      N.copy(this.up).addScaledVector(T,-this.up.dot(T));if(N.lengthSq()<1e-6)N.set(T.y,-T.x,0);N.normalize();B.crossVectors(T,N);
      const [ra,rb]=this.r(t);const sa=ra*this.scale,sb=rb*this.scale;
      for(let j=0;j<rad;j++){const a=j/rad*Math.PI*2,ca=Math.cos(a),sn=Math.sin(a);
        g.set(k+1,j,P_.x+N.x*ca*sa+B.x*sn*sb,P_.y+N.y*ca*sa+B.y*sn*sb,P_.z+N.z*ca*sa+B.z*sn*sb);}
      if(k===0)for(let j=0;j<rad;j++)g.set(0,j,P_.x,P_.y,P_.z);
      if(k===n)for(let j=0;j<rad;j++)g.set(n+2,j,P_.x,P_.y,P_.z);
    }
    g.done();
  }
}

function rdLoop(z){
  const rz=Rz(z),tz=discTaper(z),pe=(DISC_MIN+P.psi)*DEG;
  const rl=rz+GI,ru=rl+Math.max(.2,thick(DISC_MIN))*tz;
  const Di=[P.xc+rl*Math.sin(pe),P.yc+rl*Math.cos(pe)],Ds=[P.xc+ru*Math.sin(pe),P.yc+ru*Math.cos(pe)];
  const As=[-8.2,Tsurf(-8.2,z)-.3];
  const ctl=[(Ds[0]+As[0])/2,Math.max(Ds[1],As[1])+2.2];
  const sup=[];
  for(let k=0;k<NS;k++){const q=k/NS,a=(1-q)*(1-q),b=2*q*(1-q),c=q*q;let x=a*Ds[0]+b*ctl[0]+c*As[0],y=a*Ds[1]+b*ctl[1]+c*As[1];y=Math.min(y,Tsurf(x,z)-.32);sup.push([x,y]);}
  const P1=[-10.2,Tsurf(-10.2,z)-.6],Ci=mandXY(-4.1,-8);
  const c2=[Math.min(P1[0],Ci[0])-1.2,(P1[1]+Ci[1])/2];
  const wall=[];
  for(let k=0;k<NW;k++){const q=k/NW;if(q<.25){const w=q/.25;wall.push([lerp(As[0],P1[0],w),lerp(As[1],P1[1],w)]);}
    else{const w=(q-.25)/.75,a=(1-w)*(1-w),b=2*w*(1-w),c=w*w;wall.push([a*P1[0]+b*c2[0]+c*Ci[0],a*P1[1]+b*c2[1]+c*Ci[1]]);}}
  const inf=[];const pS=-138,pE=DISC_MIN+P.psi+P.theta;
  for(let k=0;k<NI;k++){const q=k/NI;
    if(k===0){inf.push(Ci);continue;}
    const phi=lerp(pS,pE,(q-1/NI)/(1-1/NI));const [hx,hy]=headXY(phi,z*.95,.3);const w=mandXY(hx,hy);
    if(k<3){const f=k/3;inf.push([lerp(Ci[0],w[0],f),lerp(Ci[1],w[1],f)]);}else inf.push(w);}
  const edge=[];for(let k=0;k<ND;k++){const q=k/ND;edge.push([lerp(Di[0],Ds[0],q),lerp(Di[1],Ds[1],q)]);}
  return{sup,wall,inf,edge,As,Di};
}
const rdCache=[];
function updateRetro(){
  for(let i=0;i<NZR;i++){
    const z=ZR*(2*i/(NZR-1)-1),w=Math.sqrt(Math.max(0,1-(z/ZR)**2));
    const L=rdLoop(z);const loop=[...L.sup,...L.wall,...L.inf,...L.edge];
    let cx=0,cy=0;for(const p of loop){cx+=p[0];cy+=p[1];}cx/=loop.length;cy/=loop.length;
    const sh=p=>[cx+(p[0]-cx)*w,cy+(p[1]-cy)*w];
    for(let j=0;j<NL;j++){const q=sh(loop[j]);retroGrid.set(i,j,q[0],q[1],z);}
    const sup=[...L.sup,L.As].map(sh),inf=[...L.inf,L.Di].map(sh);
    const off=(arr,g,d)=>{for(let j=0;j<arr.length;j++){const a=arr[Math.max(j-1,0)],b=arr[Math.min(j+1,arr.length-1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
      const p=arr[j];if((p[0]-cx)*nx+(p[1]-cy)*ny<0){nx=-nx;ny=-ny;}g.set(i,j,p[0]+nx*d,p[1]+ny*d,z);}};
    off(sup,lamSGrid,.14);off(inf,lamIGrid,.14);

}

   {pts:()=>[Wp(-9,16,17.3),Wp(-2,21,17.6),Wp(6,27,17.2)],r:cst(.8,.6)}]);
vessel({key:'maxa',name:'Artéria maxilar',kind:'a',offset:new V3(8,-20,-38),desc:'Passa medialmente ao colo do côndilo e emite ramos para a cápsula e o tecido retrodiscal.',labels:[{t:'Artéria maxilar'}]},
  [{pts:()=>[Wp(-11,-36,-4),Wp(-7,-24,-8),Wp(1,-19.5,-10.6),Wp(14,-21.5,-12.4),Wp(26,-22,-14),Wp(35,-20.5,-16)],r:cst(1.4,1.05)}]);
vessel({key:'stv',name:'Veia temporal superficial',kind:'v',offset:new V3(-40,8,28),desc:'Drena a região temporal e forma, com a veia maxilar, a veia retromandibular.',labels:[{t:'Veia temporal superficial'}]},
  [{pts:()=>[Wp(-8.5,24,18.2),Wp(-11.5,16,18),Wp(-14,6,17.8),Wp(-15.2,-5,17.4),Wp(-15.5,-14,12.5),Wp(-15,-24,8)],r:cst(1.0,1.45)}]);
vessel({key:'rmv',name:'Veia retromandibular',kind:'v',offset:new V3(-40,-20,18),desc:'Desce posterior ao ramo, dentro da parótida, e drena a região da ATM.',labels:[{t:'Veia retromandibular'}]},
  [{pts:()=>[Wp(-15,-24,8),Wp(-14.2,-40,5),Wp(-12.8,-58,3),Wp(-12.2,-74,2.5)],r:cst(1.5,1.8)}]);
vessel({key:'maxv',name:'Veia maxilar',kind:'v',offset:new V3(12,-28,-44),desc:'Drena o plexo pterigoideo e passa medialmente ao colo do côndilo.',labels:[{t:'Veia maxilar'}]},
  [{pts:()=>[Wp(34,-25,-13.5),Wp(19,-25,-11.2),Wp(5,-23,-9.4),Wp(-7,-26,-5.5),Wp(-11.5,-26,1),Wp(-15,-24,8)],r:cst(1.2,1.4)}]);
vessel({key:'atn',name:'Nervo auriculotemporal',kind:'n',offset:new V3(-44,0,12),desc:'Principal inervação sensitiva da ATM, sobretudo da cápsula posterior e do tecido retrodiscal.',labels:[{t:'Nervo auriculotemporal'}]},
  [{pts:()=>[Wp(-1,-14.5,-11.5),Wp(-7.5,-15,-6.5),Wp(-11.8,-12.5,3),Wp(-13.8,-8,11),Wp(-12.6,-1,16.4),Wp(-10.7,10,17.1),Wp(-8.2,22,17.6)],r:cst(.6,.45)},
   {pts:()=>[Wp(-11.8,-12.5,3),Wp(-10.8,-10.5,2.2),Wp(-9.2,-8.6,1.4)],r:cst(.32,.22)}]);
vessel({key:'man',name:'Nervo massetérico',kind:'n',offset:new V3(14,-6,30),desc:'Atravessa a incisura da mandíbula para o masseter e dá ramo articular à cápsula anterior.',labels:[{t:'Nervo massetérico'}]},
  [{dynamic:true,pts:()=>[Wp(4,-6.8,-12),Wp(8,-10.5,-6),Mp(11.5,-14.4,0),Mp(15,-20,5.4),Mp(17,-28,6.1)],r:cst(.55,.42)}]);

/* ---------- efeitos: estalido e crepitação ---------- */
const ring=new THREE.Mesh(new THREE.RingGeometry(.86,1,64),new THREE.MeshBasicMaterial({color:0xffa24a,transparent:true,opacity:0,depthTest:false}));
ring.renderOrder=10;scene.add(ring);let ringT=99;
const SPK=80;const spkGeo=new THREE.BufferGeometry();const spkPos=new Float32Array(SPK*3);spkGeo.setAttribute('position',new THREE.BufferAttribute(spkPos,3));
const spkMat=new THREE.PointsMaterial({color:0xffc070,size:.9,map:DOT,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.95});
const sparks=new THREE.Points(spkGeo,spkMat);sparks.frustumCulled=false;scene.add(sparks);
const spk=[];for(let i=0;i<SPK;i++)spk.push({life:0,p:new V3(),v:new V3()});

/* ---------- áudio (opcional) ---------- */
let actx=null,soundOn=false;
function noiseBurst(dur,freq,q,gain){
  if(!soundOn||!actx)return;
  try{const n=Math.max(16,Math.floor(actx.sampleRate*dur)),b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
    const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    const g=actx.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(actx.destination);s.start();}catch(e){}
}

/* ============================== rótulos ============================== */
const labelObjs=[];
for(const p of parts){
  for(const L of p.labels){
    const el=document.createElement('div');el.className='lbl'+(L.sub?' sub':'');const sp=document.createElement('span');sp.textContent=L.t;el.appendChild(sp);
    const o=new CSS2DObject(el);o.visible=false;scene.add(o);labelObjs.push({p,L,o,el});
  }
}
const _box=new THREE.Box3(),_v=new V3();
function updateLabels(e){
  const vis=e>.03;
  for(const lb of labelObjs){
    const show=vis&&lb.p.root.visible;lb.o.visible=show;if(!show)continue;
    if(lb.L.l){lb.o.position.copy(lb.L.l);lb.p.root.localToWorld(lb.o.position);}
    else{_box.setFromObject(lb.p.root);_box.getCenter(lb.o.position);}
    lb.el.style.opacity=smooth((e-.03)/.5);
  }
}

/* ============================== condição ============================== */
function setCondition(k){
  cond=k;C=CONDS[k];thick=spline1D(C.prof);
  state.dadGeom=!!C.dad;
  const hg=buildHead();headMesh.geometry.dispose();headMesh.geometry=hg;headCut.geometry=hg;
  cartMesh.geometry.dispose();cartMesh.geometry=buildHeadCart();
  rebuildDisc();calibrate();
  P.reduced=false;P.psi=C.displaced?psiD(sOf(P.u)):psiN(sOf(P.u));
  if(C.reducing&&P.u>C.uOpen){P.reduced=true;P.psi=psiN(sOf(P.u));}
  P.yc=C.y0;
  document.querySelectorAll('#conds button').forEach(b=>b.classList.toggle('on',b.dataset.c===k));
  document.getElementById('condDesc').textContent=C.desc;
}

/* ============================== interação ============================== */
let playing=true,speed=1,tc=0,explodeT=0,explode=0,cut=false;
const cutPlane=new THREE.Plane(new V3(0,0,-1),0);
const elPlay=document.getElementById('play'),elSl=document.getElementById('slider');
elPlay.onclick=()=>{playing=!playing;elPlay.textContent=playing?'Pausar':'Animar';if(playing){tc=uToCycle(P.u);}};
elSl.addEventListener('input',()=>{playing=false;elPlay.textContent='Animar';P.u=elSl.value/1000;});
document.getElementById('speed').onchange=e=>{speed=+e.target.value;};
document.querySelectorAll('#conds button').forEach(b=>b.onclick=()=>setCondition(b.dataset.c));
const bEx=document.getElementById('bExplode');bEx.onclick=()=>{explodeT=explodeT?0:1;if(explodeT){const d=camera.position.clone().sub(controls.target);const L=Math.max(d.length(),250);flyTo(new V3(0,-4,0).add(d.setLength(L)),new V3(0,-4,0));}bEx.classList.toggle('on',!!explodeT);bEx.textContent=explodeT?'Montar':'Explodir';};
const bCut=document.getElementById('bCut');bCut.onclick=()=>{cut=!cut;bCut.classList.toggle('on',cut);renderer.clippingPlanes=cut?[cutPlane]:[];
  for(const p of parts)if(p.cut)p.cut.forEach(m=>m.visible=cut);if(cut)flyTo(new V3(4,-8,72),new V3(4,-9,0));};
let fly=null;
function flyTo(pos,tgt){fly={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt};}
document.getElementById('bLateral').onclick=()=>flyTo(new V3(4,-9,84),new V3(4,-11,0));
const layerOf={tMus:'mus',tVas:'vas',tCap:'cap'};
for(const id in layerOf){document.getElementById(id).onchange=e=>{for(const p of parts)if(p.layer===layerOf[id])p.root.visible=e.target.checked;};}
document.getElementById('tSom').onchange=e=>{soundOn=e.target.checked;if(soundOn){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume().catch(()=>{});}catch(err){soundOn=false;}}};
for(const p of parts)if(p.cut)p.cut.forEach(m=>m.visible=false);

function uToCycle(u){return u<=0?0:.08+.40*(u>=1?1:inverseEase(u));}
function inverseEase(u){let lo=0,hi=1;for(let i=0;i<20;i++){const m=(lo+hi)/2;if(ease(m)<u)lo=m;else hi=m;}return(lo+hi)/2;}
function cycleU(t){if(t<.08)return 0;if(t<.48)return ease((t-.08)/.40);if(t<.58)return 1;if(t<.94)return 1-ease((t-.58)/.36);return 0;}

/* hover */
const ray=new THREE.Raycaster();ray.params.Points.threshold=.45;const mouse=new THREE.Vector2();let mouseIn=false,hovered=null,hoverInfo=null,needPick=false,lastMX=0,lastMY=0,downXY=null;
const tip=document.getElementById('tip');
renderer.domElement.addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);lastMX=e.clientX;lastMY=e.clientY;mouseIn=true;if(e.pointerType==='mouse')needPick=true;});
renderer.domElement.addEventListener('pointerleave',()=>{mouseIn=false;setHover(null);});
renderer.domElement.addEventListener('pointerdown',e=>{downXY=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'&&downXY&&Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1])<8){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);lastMX=e.clientX;lastMY=e.clientY;mouseIn=true;needPick=true;}});
function visibleChain(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pick(){
  ray.setFromCamera(mouse,camera);
  const list=hoverables.filter(visibleChain);
  const hits=ray.intersectObjects(list,false).filter(h=>!(cut&&h.point.z>.05));
  let h=hits.find(x=>!shells.has(x.object)&&!x.object.isPoints)||hits.find(x=>x.object.isPoints)||hits[0]||null;
  if(!h){setHover(null);return;}
  const p=h.object.userData.part;let name=p.name,desc=p.desc;
  if(p.region){const r=p.region(p.root.worldToLocal(h.point.clone()));name=r[0];desc=r[1];}
  setHover(p,name,desc);
}
function setHover(p,name,desc){
  hovered=p;
  if(!p){tip.style.opacity=0;renderer.domElement.style.cursor='';return;}
  tip.innerHTML='<b>'+name+'</b>'+desc;tip.style.opacity=1;renderer.domElement.style.cursor='pointer';
  const w=tip.offsetWidth,hgt=tip.offsetHeight;let x=lastMX+16,y=lastMY+14;if(x+w>innerWidth-8)x=lastMX-w-14;if(y+hgt>innerHeight-8)y=lastMY-hgt-12;tip.style.left=x+'px';tip.style.top=y+'px';
}

/* ============================== laço principal ============================== */
const elMM=document.getElementById('mm'),elG=document.getElementById('gfill'),elPh=document.getElementById('phase'),elFlash=document.getElementById('flash');
let flashT=0,crepAcc=0,openAct=0,closeAct=0,lastSl=-1;
function flash(txt){elFlash.textContent=txt;elFlash.classList.add('show');flashT=1.1;}
function fireClick(kind){
  ringT=0;flash(kind==='open'?'Estalido de abertura':'Estalido recíproco no fechamento');
  noiseBurst(.04,kind==='open'?1500:1900,1.3,kind==='open'?1.0:.6);
}
const clock=new THREE.Clock();let tAll=0;
setCondition('normal');
document.getElementById('loading').remove();

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);tAll+=dt;
  // abertura
  P.uPrev=(P.uLast===undefined)?P.u:P.uLast;
  if(playing){tc=(tc+dt*speed/3.2)%1;P.u=cycleU(tc);}
  const u=P.u;P.uLast=u;
  const sv=Math.round(u*1000);if(sv!==lastSl&&playing){elSl.value=sv;lastSl=sv;}
  const prevTh=P.theta,prevPsi=P.psi,prevX=P.xc;
  P.s=sOf(u);P.theta=-C.thetaMax*u;
  if(C.reducing){
    if(!P.reduced&&u>C.uOpen&&u>P.uPrev){P.reduced=true;fireClick('open');}
    else if(P.reduced&&u<C.uClose&&u<P.uPrev){P.reduced=false;fireClick('close');}
    else if(P.reduced&&u<=0.001){P.reduced=false;}
  }
  const psiT=(C.displaced&&!P.reduced)?psiD(P.s):psiN(P.s);
  P.psi+=(psiT-P.psi)*Math.min(1,dt*26);
  P.xc=-1+14*P.s;P.yc=solveCondyle(P.xc,P.theta,P.psi,P.yc);
  Mm.makeRotationZ(P.theta*DEG).setPosition(P.xc,P.yc,0);
  Md.makeRotationZ(-P.psi*DEG).setPosition(P.xc,P.yc,0);
  const vel=(u-P.uPrev)/Math.max(dt,1e-4);
  openAct=lerp(openAct,vel>.05?1:0,Math.min(1,dt*8));closeAct=lerp(closeAct,vel<-.05?1:0,Math.min(1,dt*8));
  P.fill=lerp(P.fill,clamp(P.s*1.05+(C.displaced&&!P.reduced?.12:0),0,1),Math.min(1,dt*6));

  // explosão
  explode+=(explodeT-explode)*Math.min(1,dt*4.5);const e=ease(explode);

  // poses
  for(const p of parts)p.root.position.copy(p.offset).multiplyScalar(e);
  pMand.root.position.set(P.xc,P.yc,0).addScaledVector(pMand.offset,e);pMand.root.rotation.set(0,0,P.theta*DEG);
  pCCart.root.position.set(P.xc,P.yc,0).addScaledVector(pCCart.offset,e);pCCart.root.rotation.set(0,0,P.theta*DEG);
  for(const p of discParts){p.root.position.set(P.xc,P.yc,0).addScaledVector(p.offset,e);p.root.rotation.set(0,0,-P.psi*DEG);}

  // estruturas dinâmicas
  updateRetro();updateCapsule();
  for(const s of strands)if(s.dynamic)s.update();
  updateSyn(P.theta-prevTh,P.psi-prevPsi,P.xc-prevX,dt);
  retroMat.color.setRGB(lerp(.80,.55,P.fill),lerp(.40,.11,P.fill),lerp(.47,.19,P.fill));
  plexMat.color.setRGB(lerp(.20,.17,P.fill),lerp(.32,.22,P.fill),lerp(.70,.62,P.fill));

  // músculos
  for(const m of MUS){const a=m.phase==='open'?openAct:closeAct;m.act=a;m.str.scale=1+.13*a;}
  const pulse=Math.pow(Math.max(0,Math.sin(tAll*Math.PI*2*1.15)),6);for(const a of ARTS)a.pulse=.18*pulse;

  // destaque
  for(const p of parts){p.hl+=((p===hovered?1:0)-p.hl)*Math.min(1,dt*12);
    for(const m of p.mats){
      if(m.isPointsMaterial){m.size=.62+.5*p.hl;m.opacity=.85;continue;}
      if(!m.emissive)continue;
      m.emissive.setRGB(.5*p.hl+.42*p.act+p.pulse,.2*p.hl+.03*p.act,.04*p.hl);
      if(m===capsMat)m.opacity=.17+.25*p.hl;
    }}

  // efeitos
  if(ringT<1.2){ringT+=dt;const k=ringT/1.2;ring.material.opacity=(1-k)*.95;ring.scale.setScalar(2+16*k);
    const w=new V3(P.xc,P.yc+2,cut?0:13);ring.position.copy(w);ring.lookAt(camera.position);}else ring.material.opacity=0;
  if(C.dad&&Math.abs(vel)>.12&&P.s>.03){crepAcc+=dt*45;while(crepAcc>1){crepAcc--;const sp=spk.find(x=>x.life<=0);if(sp){sp.life=.35+Math.random()*.3;
      const ang=(Math.random()*50-10)*DEG;const r=R0+1.2;sp.p.set(P.xc+r*Math.sin(ang),P.yc+r*Math.cos(ang),(Math.random()*2-1)*7);
      sp.v.set((Math.random()-.3)*6,Math.random()*5,(Math.random()*2-1)*6);}
      if(Math.random()<.35)noiseBurst(.006+Math.random()*.006,3500+Math.random()*2500,.9,.35);}
    if(Math.random()<dt*2.5)flash('Crepitação');}
  for(let i=0;i<SPK;i++){const s=spk[i];if(s.life>0){s.life-=dt;s.p.addScaledVector(s.v,dt);spkPos[i*3]=s.p.x;spkPos[i*3+1]=s.p.y;spkPos[i*3+2]=cut?Math.min(s.p.z,-.2):s.p.z;}else{spkPos[i*3]=1e5;spkPos[i*3+1]=1e5;spkPos[i*3+2]=1e5;}}
  spkGeo.attributes.position.needsUpdate=true;
  if(flashT>0){flashT-=dt;if(flashT<=0)elFlash.classList.remove('show');}

  // leitura
  const I=incisal(P.xc,P.yc,P.theta);const mm=Math.hypot(I[0]-C.I0[0],I[1]-C.I0[1]);
  elMM.textContent=mm.toFixed(0);elG.style.width=clamp(mm/50*100,0,100)+'%';
  let ph;
  if(Math.abs(vel)<.02)ph=u<.01?'<b>Repouso</b> em máxima intercuspidação':(u>.99?'<b>Abertura máxima</b>':'<b>Posição</b> definida manualmente');
  else if(u<.2)ph='<b>Rotação</b> do côndilo no compartimento inferior';
  else if(cond==='ddsr')ph='<b>Translação bloqueada</b> pela banda posterior';
  else ph='<b>Rotação e translação</b> do complexo côndilo-disco';
  if(C.displaced&&!P.reduced)ph+=' &nbsp;|&nbsp; disco anteriorizado';
  if(elPh.innerHTML!==ph)elPh.innerHTML=ph;

  // câmera
  if(fly){fly.t+=dt/1.0;const k=ease(fly.t);camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(fly.t>=1)fly=null;}
  controls.update();
  updateLabels(e);
  if(needPick&&mouseIn){needPick=false;pick();}
  else if(hovered&&mouseIn&&(playing||explode>.01)&&Math.random()<.2)pick();
  renderer.render(scene,camera);labelR.render(scene,camera);
}
frame();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labelR.setSize(innerWidth,innerHeight);});
window.__atm={P,C:()=>C,setCondition,camera,controls,parts};
</script>
</body>
